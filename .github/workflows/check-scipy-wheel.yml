name: Check Pyodide SciPy wheel
on:
  pull_request:
    paths:
      - '.github/workflows/check-scipy-wheel.yml'
  workflow_dispatch:
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      BASE: https://cdn.jsdelivr.net/pyodide/v0.26.4/full
    steps:
      - name: Download manifest
        run: curl -fsSL --max-time 20 -o lock.json "$BASE/pyodide-lock.json"
      - name: Extract wheel metadata
        run: |
          set -euo pipefail
          wheel=$(jq -er '.packages.scipy.file_name | select(test("^[a-zA-Z0-9_.-]+[.]whl$"))' lock.json)
          sha=$(jq -er '.packages.scipy.sha256 | select(test("^[a-f0-9]{64}$"))' lock.json)
          printf 'WHEEL=%s\nSHA=%s\n' "$wheel" "$sha" >> "$GITHUB_ENV"
      - name: Download wheel from CDN
        id: cdn
        continue-on-error: true
        run: curl -fsSL --max-time 60 -o "$WHEEL" "$BASE/$WHEEL"
      - name: Extract wheel from official release archive
        if: steps.cdn.outcome == 'failure'
        run: |
          set -euo pipefail
          curl -fsSL --max-time 120 -o release.tar.bz2 https://github.com/pyodide/pyodide/releases/download/0.26.4/pyodide-0.26.4.tar.bz2
          python - <<'PY'
          import os, pathlib, shutil, tarfile
          name = os.environ['WHEEL']
          with tarfile.open('release.tar.bz2', 'r|bz2') as archive:
              for member in archive:
                  if member.isfile() and pathlib.PurePosixPath(member.name).name == name:
                      with archive.extractfile(member) as source, open(name, 'wb') as output:
                          shutil.copyfileobj(source, output)
                      break
              else:
                  raise FileNotFoundError(name)
          PY
      - name: Verify SHA-256
        run: printf '%s  %s\n' "$SHA" "$WHEEL" | sha256sum --check
      - uses: actions/upload-artifact@v4
        with:
          name: verified-scipy-wheel
          path: ${{ env.WHEEL }}
          retention-days: 3
