name: Check Pyodide SciPy wheel
on:
  pull_request:
    paths:
      - '.github/workflows/check-scipy-wheel.yml'
  workflow_dispatch:
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      BASE: https://cdn.jsdelivr.net/pyodide/v0.26.4/full
    steps:
      - name: Download manifest
        run: curl -fsSL --max-time 20 -o lock.json "$BASE/pyodide-lock.json"
      - name: Extract wheel metadata
        run: |
          set -euo pipefail
          wheel=$(jq -er '.packages.scipy.file_name | select(test("^[a-zA-Z0-9_.-]+[.]whl$"))' lock.json)
          sha=$(jq -er '.packages.scipy.sha256 | select(test("^[a-f0-9]{64}$"))' lock.json)
          printf 'WHEEL=%s\nSHA=%s\n' "$wheel" "$sha" >> "$GITHUB_ENV"
      - name: Download wheel from CDN
        id: cdn
        continue-on-error: true
        run: curl -fsSL --max-time 60 -o "$WHEEL" "$BASE/$WHEEL"
      - name: Extract wheel from official release archive
        if: steps.cdn.outcome == 'failure'
        run: |
          set -euo pipefail
          curl -fsSL --max-time 120 -o release.tar.bz2 https://github.com/pyodide/pyodide/releases/download/0.26.4/pyodide-0.26.4.tar.bz2
          python - <<'PY'
          import os, pathlib, shutil, tarfile
          name = os.environ['WHEEL']
          with tarfile.open('release.tar.bz2', 'r|bz2') as archive:
              for member in archive:
                  if member.isfile() and pathlib.PurePosixPath(member.name).name == name:
                      with archive.extractfile(member) as source, open(name, 'wb') as output:
                          shutil.copyfileobj(source, output)
                      break
              else:
                  raise FileNotFoundError(name)
          PY
      - name: Verify SHA-256
        run: printf '%s  %s\n' "$SHA" "$WHEEL" | sha256sum --check
      - name: Compress and split verified wheel
        run: gzip -c "$WHEEL" | split -b 2M -d -a 3 - scipy-part-
      - uses: actions/upload-artifact@v4
        with:
          name: scipy-part-000
          path: scipy-part-000
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: scipy-part-001
          path: scipy-part-001
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: scipy-part-002
          path: scipy-part-002
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: scipy-part-003
          path: scipy-part-003
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: scipy-part-004
          path: scipy-part-004
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: scipy-part-005
          path: scipy-part-005
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: scipy-part-006
          path: scipy-part-006
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: scipy-part-007
          path: scipy-part-007
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: scipy-part-008
          path: scipy-part-008
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: scipy-part-009
          path: scipy-part-009
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: scipy-part-010
          path: scipy-part-010
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: scipy-part-011
          path: scipy-part-011
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: scipy-part-012
          path: scipy-part-012
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: scipy-part-013
          path: scipy-part-013
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: scipy-part-014
          path: scipy-part-014
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: scipy-part-015
          path: scipy-part-015
          if-no-files-found: ignore
      - name: Run Cubature solver with native SciPy
        run: |
          set -euo pipefail
          python3 -m venv cubature-venv
          cubature-venv/bin/python -m pip --disable-pip-version-check install numpy scipy
          curl -fsSL --max-time 20 -o cubature_generic.py https://raw.githubusercontent.com/jukzi/cubature_atlas/762caf71789f7907fb378226a9bda0d10b1e7f18/code/cubature_generic.py
          cubature-venv/bin/python cubature_generic.py --out cubature_result.json
      - uses: actions/upload-artifact@v4
        with:
          name: cubature-result
          path: cubature_result.json
      - uses: actions/upload-artifact@v4
        with:
          name: verified-scipy-wheel
          path: ${{ env.WHEEL }}
          retention-days: 3
