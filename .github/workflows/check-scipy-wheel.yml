name: Check Pyodide SciPy wheel
on:
  pull_request:
    paths:
      - '.github/workflows/check-scipy-wheel.yml'
  workflow_dispatch:
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      BASE: https://cdn.jsdelivr.net/pyodide/v0.26.4/full
    steps:
      - name: Download manifest
        run: curl -fsSL --max-time 20 -o lock.json "$BASE/pyodide-lock.json"
      - name: Extract wheel metadata
        run: |
          set -euo pipefail
          wheel=$(jq -er '.packages.scipy.file_name | select(test("^[a-zA-Z0-9_.-]+[.]whl$"))' lock.json)
          sha=$(jq -er '.packages.scipy.sha256 | select(test("^[a-f0-9]{64}$"))' lock.json)
          printf 'WHEEL=%s\nSHA=%s\n' "$wheel" "$sha" >> "$GITHUB_ENV"
      - name: Download wheel
        run: curl -fsSL --max-time 60 --max-filesize 33554432 -o "$WHEEL" "$BASE/$WHEEL"
      - name: Verify SHA-256
        run: printf '%s  %s\n' "$SHA" "$WHEEL" | sha256sum --check
