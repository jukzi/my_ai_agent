name: JavaScript-Syntax
on:
  pull_request:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check inline scripts in agent.html
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess
          import tempfile

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.active = None
                  self.scripts = []

              def handle_starttag(self, tag, attrs):
                  if tag != 'script':
                      return
                  attrs = dict(attrs)
                  kind = (attrs.get('type') or '').strip().lower()
                  if 'src' not in attrs and kind in ('', 'module', 'text/javascript', 'application/javascript'):
                      self.active = (kind, self.getpos()[0], [])

              def handle_data(self, text):
                  if self.active is not None:
                      self.active[2].append(text)

              def handle_endtag(self, tag):
                  if tag == 'script' and self.active is not None:
                      self.scripts.append(self.active)
                      self.active = None

          parser = Scripts()
          parser.feed(Path('agent.html').read_text(encoding='utf-8'))
          parser.close()
          if parser.active is not None or not parser.scripts:
              raise SystemExit('Missing or unclosed JavaScript block in agent.html')
          failed = False
          with tempfile.TemporaryDirectory() as tmp:
              for i, (kind, line, chunks) in enumerate(parser.scripts, 1):
                  path = Path(tmp) / (f'script-{i}.' + ('mjs' if kind == 'module' else 'cjs'))
                  path.write_text('\n' * (line - 1) + ''.join(chunks), encoding='utf-8')
                  if subprocess.run(['node', '--check', str(path)]).returncode:
                      print(f'::error file=agent.html,line={line}::Syntax error in script {i}')
                      failed = True
          raise SystemExit(int(failed))
          PY
