name: Deploy static MyAiAgent
on:
  push:
    branches: [main]
    paths: [agent.html, .github/workflows/static-pages.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Stage static site from the triggering commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site
          curl --fail --silent --show-error --retry 2 --max-time 20 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github.raw+json' \
            --output _site/agent.html \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/contents/agent.html?ref=$GITHUB_SHA"
          test -s _site/agent.html
          printf '%s\n' '<!doctype html><meta charset="utf-8"><title>MyAiAgent</title><meta http-equiv="refresh" content="0; url=agent.html"><a href="agent.html">MyAiAgent öffnen</a>' > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..10}; do
            if count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length') && [[ "$count" == 1 ]]; then
              exit 0
            fi
            if [[ "$attempt" != 10 ]]; then sleep 2; fi
          done
          echo '::error::Expected exactly one unexpired github-pages artifact in this run.'
          exit 1
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          reporting_interval: 1000
