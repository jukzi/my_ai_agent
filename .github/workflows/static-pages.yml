name: Deploy static MyAiAgent
on:
  push:
    branches: [main]
    paths: [agent.html, .github/workflows/static-pages.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Stage static site
        run: |
          mkdir -p _site
          cp agent.html _site/agent.html
          printf '%s\n' '<!doctype html><meta charset="utf-8"><title>MyAiAgent</title><meta http-equiv="refresh" content="0; url=agent.html"><a href="agent.html">MyAiAgent öffnen</a>' > _site/index.html
          cmp agent.html _site/agent.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
